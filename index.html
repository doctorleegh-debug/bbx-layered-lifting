<!DOCTYPE html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼스널 레이어드 리프팅 — 초안</title>
<style>
  /* 아임웹 쪽 기본 스타일을 흉내 낸다. 위젯이 이걸 오염시키면 즉시 보인다. */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:auto; }
  body{ margin:0; background:#ffffff; color:#222; font-family:system-ui,'Malgun Gothic',sans-serif;
        font-size:16px; line-height:1.7; }
  .iw-head{ position:sticky; top:0; z-index:1000; height:64px; background:#fff;
            border-bottom:1px solid #e5e5e5; display:flex; align-items:center;
            gap:22px; padding:0 28px; }
  .iw-head b{ font-size:17px; letter-spacing:-.02em; }
  .iw-head a{ color:#444; text-decoration:none; font-size:14px; }
  .iw-sec{ max-width:1100px; margin:0 auto; padding:70px 24px; }
  .iw-sec h2{ font-size:26px; margin:0 0 14px; }
  .iw-box{ background:#f4f4f4; border:1px solid #e3e3e3; border-radius:8px;
           padding:28px; margin:16px 0; }
  .iw-foot{ background:#1a1a1a; color:#bbb; padding:56px 28px; font-size:14px; }
  #probe{ position:fixed; right:10px; bottom:10px; z-index:99999; background:#000; color:#0f0;
          font:11px/1.5 monospace; padding:8px 10px; border-radius:6px; white-space:pre; }
</style>
</head><body>

<header class="iw-head">
  <b>뷰티블라썸의원</b>
  <a href="#">병원소개</a><a href="#">시술안내</a><a href="#">예약</a>
</header>


<!-- ════════ 여기부터 코드위젯 ════════ -->
<div id="widget-slot">불러오는 중…</div>
<!-- ════════ 코드위젯 끝 ════════ -->


<footer class="iw-foot">
  <div class="iw-box" style="max-width:520px">오염 검사용 — 배경 #f4f4f4 / 테두리 #e3e3e3 이어야 한다.</div>
  아임웹 자체 푸터 — 위젯 푸터가 아니다.
</footer>

<div id="probe">측정 대기…</div>

<script>
/* 코드위젯 붙여넣기를 흉내 낸다: HTML 문자열을 삽입하고 스크립트를 실행시킨다.
   (아임웹 코드위젯도 innerHTML 로 들어가 script 가 자동 실행되지 않으므로 동일 조건) */
fetch('widget.html').then(r=>r.text()).then(html=>{
  const slot=document.getElementById('widget-slot');
  slot.innerHTML=html;
  const run=[...slot.querySelectorAll('script')];
  (function next(i){
    if(i>=run.length) return;
    const old=run[i], s=document.createElement('script');
    if(old.src){ s.src=old.src; s.onload=()=>next(i+1); s.onerror=()=>next(i+1); }
    else { s.textContent=old.textContent; }
    old.replaceWith(s);
    if(!old.src) next(i+1);
  })(0);
});
</script>
</body></html>
